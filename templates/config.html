<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>OutSystems Analyzer - Configurations</title>
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/layout.css') }}" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="../static/img/logo.png">
</head>

<body>
    <div class="container">
        <h2 class="report-section-header mt-5">> SYSTEM_CONFIGURATIONS</h2>
        
        <form action="/config" method="POST">

        <section class="mt-4">
            <div class="terminal-card">
                <div class="terminal-window-header">
                    <div class="terminal-controls">
                        <span class="control-dot red"></span>
                        <span class="control-dot yellow"></span>
                        <span class="control-dot green"></span>
                    </div>
                    <div class="mx-auto small text-muted opacity-50">PROTOCOL_SETTINGS</div>
                </div>
                <div class="p-4">
                    <p class="data-label mb-3">Network Request Protocols</p>
                    <div class="form-check form-switch">
                        <input name="use_random_headers" class="form-check-input border-secondary" type="checkbox" role="switch"
                            id="switchrandomheaders" {% if config.use_random_headers %}checked{% endif %}>
                        <label class="form-check-label text-muted small" for="switchrandomheaders">ENABLE_RANDOM_HEADERS (Anti-Bot Bypass)</label>
                    </div>
                    
                    <div class="row mb-3 mt-3">
                        <label for="inputRequestTimeout" class="col-sm-10 col-form-label small text-muted">REQUEST_TIMEOUT_INTERVAL (Seconds)</label>
                        <div class="col-sm-2">
                        <input name="request_timeout" type="number" class="form-control form-control-hacker text-center" id="inputRequestTimeout" value="{{ config.request_timeout }}">
                        </div>
                    </div>

                    <div class="row mb-3">
                        <label for="inputMaxAttempts" class="col-sm-10 col-form-label small text-muted">MAX_RETRY_THRESHOLD</label>
                        <div class="col-sm-2">
                        <input name="max_attempts" type="number" class="form-control form-control-hacker text-center" id="inputMaxAttempts" value="{{ config.max_attempts }}">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="mt-2">
            <div class="terminal-card">
                <div class="terminal-window-header">
                    <div class="terminal-controls">
                        <span class="control-dot red"></span>
                        <span class="control-dot yellow"></span>
                        <span class="control-dot green"></span>
                    </div>
                    <div class="mx-auto small text-muted opacity-50">ENGINE_PERFORMANCE</div>
                </div>
                <div class="p-4">
                    <div class="form-check form-switch">
                        <input name="quick_mode" class="form-check-input border-secondary" type="checkbox" role="switch"
                            id="switchQuickMode" {% if config.quick_mode %}checked{% endif %}>
                        <label class="form-check-label text-muted small" for="switchQuickMode">QUICK_SCAN_MODE (Skip Intensive Modules)</label>
                    </div>
                    <div class="form-check form-switch mt-2">
                        <input name="debug_mode" class="form-check-input border-secondary" type="checkbox" role="switch"
                            id="switchdebugMode" {% if config.debug_mode %}checked{% endif %}>
                        <label class="form-check-label text-muted small" for="switchdebugMode">VERBOSE_DEBUG_LOGS (Real-time Console Output)</label>
                    </div>
                </div>
            </div>
        </section>

        <section class="mt-2">
            <div class="terminal-card">
                <div class="terminal-window-header">
                    <div class="terminal-controls">
                        <span class="control-dot red"></span>
                        <span class="control-dot yellow"></span>
                        <span class="control-dot green"></span>
                    </div>
                    <div class="mx-auto small text-muted opacity-50">INTELLIGENCE_MODULE</div>
                </div>
                <div class="p-4">
                    <div class="row mb-4">
                        <label for="inputGeminiKey" class="col-sm-4 col-form-label small text-muted">GEMINI_INTELLIGENCE_TOKEN</label>
                        <div class="col-sm-8">
                        <input name="gemini_api_key" type="password" class="form-control form-control-hacker" id="inputGeminiKey" value="{{ gemini_api_key }}" placeholder="Paste your API key here...">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label small text-muted">VOLATILE_MEMORY_PURGE</label>
                        <div class="col-sm-8">
                        <button type="button" id="btn-clear-ai-cache" class="btn btn-hacker-danger btn-sm">
                            <i class="bi bi-trash3 me-2"></i>PURGE_AI_CACHE
                        </button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="d-flex justify-content-end gap-3 mt-4 mb-5">
            <a class="btn btn-hacker d-inline-flex align-items-center px-4" href="/">
                <i class="bi bi-arrow-left me-2"></i> RETURN_TO_BASE
            </a>
            <button type="submit" class="btn btn-hacker-main d-inline-flex align-items-center px-4">
                <i class="bi bi-shield-check me-2"></i> APPLY_CHANGES
            </button>
        </div>
        </form>


    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
document.getElementById('btn-clear-ai-cache').addEventListener('click', function() {
    if (confirm('Are you sure you want to clear the entire AI cache? This cannot be undone.')) {
        fetch('/clear-ai-cache', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
        })
        .catch(error => {
            console.error('Erro:', error);
            alert('Error processing request.');
        });
    }
});
</script>
</body>

</html>
